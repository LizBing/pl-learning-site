name: Publish Learning Workbench

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Generate homepage metadata
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from "node:fs";
          import { workbenches } from "./dist/workbenches.js";

          const courses = Object.values(workbenches).map(({ name, modules }) => ({
            name,
            lessons: modules.reduce((total, module) => total + module.lessons.length, 0),
          }));

          writeFileSync("dist/workbench-info.json", JSON.stringify({
            revision: process.env.GITHUB_SHA,
            publishedAt: new Date().toISOString(),
            courses,
          }) + "\n");
          JS
      - name: Name the Pages artifact
        id: artifact
        run: echo "name=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
